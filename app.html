<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abnahmeprotokoll erstellen – kostenlos, ohne Konto | Abnahmeprotokoll.ch</title>
<meta name="description" content="Wohnungsabnahme Schritt für Schritt auf dem Handy: Zählerstände, Schlüssel, Räume, Mängel, Fotos und Unterschriften. Kostenlos, ohne Konto, Daten bleiben auf Ihrem Gerät.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://abnahmeprotokoll.ch/app">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#1F5F8B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Abnahme">
<link rel="preload" href="/fonts/ibm-plex-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{
  --bg:#EEF1F3; --paper:#FFFFFF; --ink:#16212B; --muted:#5C6B78; --line:#CFD6DC;
  --accent:#1F5F8B; --accent-ink:#FFFFFF; --warn:#B0432F; --warn-bg:#FBE9E5; --ok-bg:#E4EEF6; --ok:#1F5F8B;
  --field:#F6F8F9; --focus:#1F5F8B; --note:#FFF6DB; --note-ink:#6B4E00;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141A1F; --paper:#1D252C; --ink:#EEF2F4; --muted:#9AA8B3; --line:#36434D;
  --accent:#6FAEE0; --accent-ink:#0E1B26; --warn:#F0836F; --warn-bg:#3A231F; --ok-bg:#1E3247; --ok:#8FC3EC; --field:#242E36; --note:#3A3117; --note-ink:#F1D98A;
}}
:root[data-theme="dark"]{
  --bg:#141A1F; --paper:#1D252C; --ink:#EEF2F4; --muted:#9AA8B3; --line:#36434D;
  --accent:#6FAEE0; --accent-ink:#0E1B26; --warn:#F0836F; --warn-bg:#3A231F; --ok-bg:#1E3247; --ok:#8FC3EC; --field:#242E36; --note:#3A3117; --note-ink:#F1D98A;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;line-height:1.2}
p{margin:0}
a{color:var(--accent)}

#app{max-width:680px;margin:0 auto;padding:0 14px 130px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:14px 0 10px}
.brand{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px}
.brand b{color:var(--ink);font-weight:600;letter-spacing:.01em}
.brand .type{background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:2px 10px;font-weight:500;color:var(--ink)}
.stepline{display:flex;gap:3px;margin-bottom:10px}
.stepline i{flex:1;height:4px;background:var(--line);border-radius:2px}
.stepline i.done{background:var(--accent)}
.stepline i.cur{background:var(--ink)}
.stepname{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.stepname small{color:var(--muted);white-space:nowrap}
.stepname h1{font-size:22px}

.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
.card h2{font-size:17px;margin-bottom:8px}
.hint{color:var(--muted);font-size:14px;margin-bottom:10px}
.note{background:var(--note);color:var(--note-ink);border-radius:8px;padding:10px 12px;font-size:14px;margin-top:10px}
.antritt{font-size:13px;color:var(--muted);background:var(--field);border-left:3px solid var(--line);padding:6px 10px;border-radius:0 6px 6px 0;margin:6px 0 8px}
.antritt b{color:var(--ink);font-weight:500}

label.f{display:block;margin:10px 0 0}
label.f span{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=number],input[type=email],input[type=datetime-local],input[type=date],textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--field);min-height:44px}
textarea{min-height:70px;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}

.row{display:grid;gap:8px;align-items:end}
.row.z{grid-template-columns:1.3fr 1fr 1fr}
.row.k2{grid-template-columns:1fr 1fr 1.6fr}
.row.two{grid-template-columns:1fr 1fr}
.row + .row{margin-top:8px}
.lbl{font-size:13px;color:var(--muted)}

.line{padding:12px 0;border-top:1px solid var(--line)}
.line:first-of-type{border-top:0;padding-top:4px}
.line .t{font-weight:500;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}

.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;padding:9px 4px;background:var(--field);border:0;border-right:1px solid var(--line);min-height:42px;color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button.on-ok{background:var(--ok-bg);color:var(--ok);font-weight:600}
.seg button.on-mangel{background:var(--warn-bg);color:var(--warn);font-weight:600}
.seg button.on-na{background:var(--line);color:var(--ink);font-weight:600}
.seg.small button{padding:6px 4px;min-height:36px;font-size:14px}

.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.chk:first-of-type{border-top:0}
.chk input{width:24px;height:24px;flex:none;margin:1px 0 0;accent-color:var(--accent)}
.chk span{flex:1}
.toggles{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.toggles label{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:99px;padding:8px 12px;background:var(--field);min-height:42px}
.toggles input{accent-color:var(--accent);width:20px;height:20px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--field);font-size:20px}
.stepper output{min-width:36px;text-align:center;font-weight:600;font-size:18px}

.photos{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.photos .ph{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--field)}
.photos .ph img{width:100%;height:100%;object-fit:cover;display:block}
.photos .ph b{position:absolute;left:0;bottom:0;background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:1px 5px;border-radius:0 6px 0 0;font-weight:600}
.photos .ph .x{position:absolute;top:0;right:0;width:24px;height:24px;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:1;border-radius:0 0 0 8px;padding:0}
.photos .add{width:72px;height:72px;border:1.5px dashed var(--accent);border-radius:8px;background:transparent;color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:600}
.photos .add svg{width:22px;height:22px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:9px;border:1px solid var(--line);background:var(--paper);min-height:46px;cursor:pointer;text-decoration:none;color:inherit}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.ghost{background:transparent}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn.block{display:flex;width:100%}
.btn:disabled{opacity:.45;cursor:default}
.stack{display:flex;flex-direction:column;gap:10px}

.navbar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.navbar .in{max-width:680px;margin:0 auto;display:flex;gap:10px}
.navbar .in .btn{flex:1}
.navbar .in .btn.primary{flex:2}
.saved{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}

.roomhead{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.roomhead input{flex:1}
.addrow{display:flex;gap:8px;margin-top:10px}
.addrow input,.addrow select{flex:1}

.sig{border:1px solid var(--line);border-radius:8px;background:#fff;touch-action:none;width:100%;height:150px;display:block}
.sigtools{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:13px;color:var(--muted)}

.summary{font-size:14px;color:var(--muted)}
.summary b{color:var(--ink)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.tag.m{background:var(--warn-bg);color:var(--warn)}
.tag.n{background:var(--ok-bg);color:var(--ok)}

/* start screen */
.hero{padding:26px 0 6px}
.hero h1{font-size:26px;margin-bottom:6px}
.hero p{color:var(--muted)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice button{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:14px 12px;text-align:left;min-height:82px}
.choice button.on{border-color:var(--accent);background:var(--ok-bg)}
.choice button b{display:block;font-size:16px;margin-bottom:2px}
.choice button small{color:var(--muted);font-size:13px}
.legal{font-size:12px;color:var(--muted);text-align:center;margin-top:20px}
.legal a{color:var(--muted)}

/* feedback */
.fb-btn{position:fixed;right:14px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:6;border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:8px 14px;font-size:13px;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.12)}
body.start .fb-btn{bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.modal .box{background:var(--paper);width:100%;max-width:680px;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.modal .box h2{font-size:18px;margin-bottom:4px}
.modal .box .small{font-size:12px;color:var(--muted);margin-top:8px}
.modal .actions{display:flex;gap:10px;margin-top:12px}
.modal .actions .btn{flex:1}

/* protocol view */
#proto{display:none}
body.showproto #app,body.showproto .fb-btn{display:none}
body.showproto #proto{display:block}
.pv-tools{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 14px;border-bottom:1px solid var(--line)}
.pv-tools .in{max-width:800px;margin:0 auto;display:flex;gap:8px;flex-wrap:wrap}
.pv-tools .btn{flex:1;min-width:130px}
.pv-after{max-width:800px;margin:16px auto 0;padding:0 14px}
.doc{background:#fff;color:#111;max-width:800px;margin:16px auto;padding:28px 26px;font-size:13px;line-height:1.4;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.doc h1{font-size:22px;letter-spacing:.01em}
.doc .sub{color:#555;margin:2px 0 16px}
.doc h2{font-size:15px;margin:22px 0 8px;padding-bottom:4px;border-bottom:2px solid #111}
.doc table{width:100%;border-collapse:collapse;margin-top:6px}
.doc th,.doc td{border:1px solid #999;padding:5px 7px;text-align:left;vertical-align:top;font-size:12.5px}
.doc th{background:#EEE;font-weight:600}
.doc .kv td:first-child{width:38%;background:#F5F5F5;font-weight:500}
.doc .empty{color:#888}
.doc .st-ok{color:#1F5F8B;font-weight:600}
.doc .st-m{color:#B0432F;font-weight:600}
.doc .st-na{color:#777}
.doc .ant{color:#666;font-size:11.5px}
.doc .ph-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:10px}
.doc .ph-list figure{margin:0;break-inside:avoid;page-break-inside:avoid}
.doc .ph-list img{width:100%;border:1px solid #999;display:block}
.doc .ph-list figcaption{font-size:11.5px;margin-top:3px}
.doc .ph-list figcaption b{display:block;font-size:12px}
.doc .mini{display:inline-block;width:52px;height:52px;object-fit:cover;border:1px solid #999;margin:2px 3px 0 0;vertical-align:top}
.doc .chkline{margin:3px 0}
.doc .chkline span{display:inline-block;width:16px;height:16px;border:1.5px solid #111;vertical-align:-3px;margin-right:6px;text-align:center;line-height:13px;font-size:12px}
.doc .sigs{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:22px}
.doc .sigs div{border-top:1px solid #111;padding-top:6px;font-size:12px}
.doc .sigs img{display:block;max-height:80px;margin-bottom:6px}
.doc .sigs .blank{height:80px}
.doc .pb{page-break-before:always;break-before:page}
.doc .foot{margin-top:26px;padding-top:8px;border-top:1px solid #CCC;font-size:10.5px;color:#777;display:flex;justify-content:space-between;gap:10px}
.doc .legalnote{font-size:11px;color:#666;margin-top:14px}
@media print{
  :root{padding:0}
  body{background:#fff}
  #app,.pv-tools,.pv-after,.fb-btn,.modal{display:none!important}
  #proto{display:block!important}
  .doc{box-shadow:none;margin:0;padding:0;max-width:none}
  .doc h2{break-after:avoid}
  .doc tr{break-inside:avoid}
  @page{margin:16mm 14mm}
}
@media (prefers-reduced-motion:no-preference){ .card{animation:in .18s ease-out} @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}} }
</style>
</head>
<body class="start">
<div id="app"></div>
<div id="proto"></div>
<button class="fb-btn" id="fb-open">Feedback</button>
<div class="modal" id="fb-modal" role="dialog" aria-modal="true">
  <div class="box">
    <h2>Feedback</h2>
    <p class="hint">Fehlt etwas? Funktioniert etwas nicht? Wir lesen jede Nachricht.</p>
    <label class="f"><span>Art</span><select id="fb-type"><option value="fehlt">Etwas fehlt</option><option value="fehler">Funktioniert nicht</option><option value="idee">Idee / Wunsch</option><option value="lob">Sonstiges</option></select></label>
    <label class="f"><span>Nachricht</span><textarea id="fb-text" placeholder="Was ist Ihnen aufgefallen?"></textarea></label>
    <label class="f"><span>E-Mail (optional, falls wir nachfragen dürfen)</span><input type="email" id="fb-mail" autocomplete="email"></label>
    <p class="small">Mitgesendet werden nur: aktueller Schritt, Protokolltyp, Gerät/Browser. Keine Protokolldaten, keine Fotos.</p>
    <div class="actions"><button class="btn" id="fb-cancel">Abbrechen</button><button class="btn primary" id="fb-send">Senden</button></div>
    <p class="small" id="fb-status"></p>
  </div>
</div>
<form name="feedback" method="POST" data-netlify="true" netlify-honeypot="website" hidden>
  <input type="text" name="type"><textarea name="message"></textarea><input type="email" name="email"><input type="text" name="context"><input type="text" name="website">
</form>
<input type="file" id="picker" accept="image/*" multiple hidden>
<input type="file" id="importer" accept=".json,application/json" hidden>

<script>
(function(){
'use strict';
const APP_NAME='Abnahmeprotokoll.ch', APP_VER='0.1', SITE='https://abnahmeprotokoll.ch';
const useCap=n=>(window.claude&&typeof window.claude.use==='function')?window.claude.use(n).catch(()=>null):Promise.resolve(null);

/* ================= profile CH ================= */
const ITEMS={
  zimmer:['Wände / Decken: Risse, Dübellöcher, Flecken, Tapeten, Anstrich','Böden: Parkett / Laminat / Teppich / Platten – Kratzer, Flecken, Druckstellen','Fenster / Storen / Rollläden: Glas, Rahmen, Dichtungen, Bedienung','Türen / Schlösser / Beschläge','Heizung: Radiatoren, Ventile, Thermostat','Elektro: Steckdosen, Schalter, Leuchten, Deckenanschlüsse','Einbauschränke / Garderobe'],
  kueche:['Wände / Decken / Wandbelag','Boden','Fenster / Storen','Kochherd / Glaskeramik / Backofen','Kühlschrank / Tiefkühler (abgetaut, gereinigt)','Geschirrspüler','Dampfabzug / Filter','Spüle / Armaturen / Abfluss','Schränke / Fronten / Schubladen / Arbeitsfläche','Elektro: Steckdosen, Schalter, Leuchten'],
  bad:['Wände / Platten / Fugen','Boden / Platten','WC / Spülung / WC-Deckel','Lavabo / Armaturen / Ablauf','Dusche / Badewanne / Duschwand','Silikonfugen / Kalk / Schimmel','Spiegelschrank / Ablagen','Lüftung / Fenster','Elektro: Steckdosen, Schalter, Leuchten'],
  flur:['Wände / Decken','Boden','Wohnungstür / Schloss / Spion / Sonnerie','Garderobe / Einbauschrank','Elektro: Schalter, Leuchten, Gegensprechanlage'],
  balkon:['Bodenbelag','Geländer / Brüstung','Storen / Sonnenstoren','Aussenwand / Decke','Reinigung'],
  neben:['Vollständig geräumt','Gereinigt / gewischt','Tür / Schloss / Abteilgitter unbeschädigt','Beleuchtung funktionsfähig']
};
const KIND_LABEL={zimmer:'Zimmer',kueche:'Küche',bad:'Bad / WC',flur:'Flur / Korridor',balkon:'Balkon / Terrasse / Sitzplatz',neben:'Nebenraum'};
const NEBEN=[['keller','Kellerabteil'],['estrich','Estrich / Dachboden'],['garage','Garage / Parkplatz'],['waschkueche','Waschküche'],['reduit','Réduit / Abstellraum'],['velo','Veloraum']];
const ALLG={
  rueckgabe:['Wohnung vollständig geräumt und gereinigt (Endreinigung)','Fenster, Storen und Lamellen gereinigt','Backofen, Dampfabzugfilter, Kühlschrank gereinigt / abgetaut','Briefkasten geleert, Namensschild entfernt','Sonnerie / Gegensprechanlage: Namensschild entfernt','Nägel / Dübel entfernt, Löcher fachgerecht verschlossen','Eigene Einbauten zurückgebaut (sofern vereinbart)'],
  antritt:['Wohnung gereinigt übernommen','Alle Schlüssel gemäss Liste erhalten','Rauchmelder vorhanden (sofern installiert)','Namensschilder an Briefkasten und Sonnerie bestellt','Hausordnung / Waschküchenplan erhalten']
};

const mkItem=l=>({label:l,status:'',comment:'',art:'',photos:[]});
const mkRoom=(n,kind)=>({name:n,kind,items:ITEMS[kind].map(mkItem)});
const mkNeben=(key,n)=>({key,name:n,checks:ITEMS.neben.map(l=>({label:l,done:false})),comment:'',photos:[]});

function freshState(){
  return {
    ver:APP_VER, stage:'start', inProgress:false, step:0, photoCounter:0, type:'', objektArt:'wohnung',
    setup:{zimmer:3,baeder:1,flur:true,balkon:true,keller:true,estrich:false,garage:false,waschkueche:false,reduit:false,velo:false},
    meta:{objekt:'',lage:'',mieter:'',vermieter:'',datum:'',zeugen:''},
    zaehler:['Strom','Wasser kalt','Wasser warm','Heizung / Wärmezähler','Gas'].map(n=>({name:n,nr:'',ein:'',aus:'',photos:[]})),
    schluessel:['Wohnungstür','Haustür','Briefkasten','Keller / Estrich','Garage / Parkplatz','Waschküche','Sonstige (Badge, Chip, Fernbedienung)'].map(n=>({name:n,ein:'',aus:'',bem:''})),
    raeume:[], neben:[],
    allg:{checks:[],comment:'',photos:[]},
    maengel:[],
    fin:{depotBank:'',depotBetrag:'',depotFreigabe:'',iban:'',adresse:'',frist:'',vereinbarungen:''},
    abschluss:{checks:['Protokoll wurde beiden Parteien zur Durchsicht vorgelegt','Beide Parteien erhalten je ein Exemplar (PDF)','Mieter anwesend und hat unterschrieben'].map(l=>({label:l,done:false})),ort:'',sigV:'',sigM:''},
    antritt:null
  };
}
let S=freshState();

function buildRooms(st){
  const s=st.setup, r=[];
  for(let i=1;i<=s.zimmer;i++) r.push(mkRoom(s.zimmer===1?'Zimmer':'Zimmer '+i,'zimmer'));
  r.push(mkRoom('Küche','kueche'));
  for(let i=1;i<=s.baeder;i++) r.push(mkRoom(s.baeder===1?'Bad / WC':'Bad / WC '+i,'bad'));
  if(s.flur) r.push(mkRoom('Flur / Korridor','flur'));
  if(s.balkon) r.push(mkRoom('Balkon / Sitzplatz','balkon'));
  st.raeume=r;
  st.neben=NEBEN.filter(([k])=>s[k]).map(([k,n])=>mkNeben(k,n));
  st.allg.checks=ALLG[st.type].map(l=>({label:l,done:false}));
}

/* ================= persistence ================= */
const DB='abnahmeprotokoll',STORE='kv';
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e)}});}
async function load(){try{const d=await idb();return await new Promise((res,rej)=>{const t=d.transaction(STORE,'readonly').objectStore(STORE).get('state');t.onsuccess=()=>res(t.result||null);t.onerror=()=>rej(t.error);});}catch(e){return null}}
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(async()=>{try{const d=await idb();await new Promise((res,rej)=>{const t=d.transaction(STORE,'readwrite');t.objectStore(STORE).put(S,'state');t.oncomplete=res;t.onerror=()=>rej(t.error);});setSaved('Automatisch gespeichert – nur auf diesem Gerät');}catch(e){setSaved('Nicht gespeichert – Speicher nicht verfügbar');}},400);}
function setSaved(t){const e=document.querySelector('.saved');if(e)e.textContent=t;}

/* ================= helpers ================= */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl=s=>esc(s).replace(/\n/g,'<br>');
function get(p){return p.split('.').reduce((o,k)=>o==null?o:o[k],S);}
function set(p,v){const ks=p.split('.');let o=S;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=v;save();}
const $=s=>document.querySelector(s);
const isR=()=>S.type==='rueckgabe';
const TYPE_LABEL=()=>isR()?'Rückgabe (Auszug)':'Antritt (Einzug)';

/* ================= steps ================= */
function steps(){
  const st=[
    {n:'Objekt & Parteien',r:rMeta},
    {n:'Zählerstände',r:rZaehler},
    {n:'Schlüssel',r:rSchluessel},
    {n:'Räume',r:rRaeume},
  ];
  if(S.neben.length) st.push({n:'Nebenräume',r:rNeben});
  st.push({n:'Allgemein',r:rAllg});
  st.push({n:'Mängel',r:rMaengel});
  st.push({n:isR()?'Depot & Adresse':'Depot & Vereinbarungen',r:rFin});
  st.push({n:'Abschluss & Unterschriften',r:rAbschluss});
  return st;
}

function photosHtml(path){
  const arr=get(path)||[];
  return `<div class="photos" data-ppath="${path}">`+arr.map((p,i)=>`<div class="ph"><img src="${p.src}" alt="Foto ${p.n}"><b>Foto ${p.n}</b><button class="x" data-delphoto="${path}|${i}" aria-label="Foto ${p.n} entfernen">×</button></div>`).join('')+
  `<button class="add" data-addphoto="${path}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Foto</button></div>`;
}
const field=(p,l,t='text',ph='')=>`<label class="f"><span>${l}</span><input type="${t}" data-bind="${p}" value="${esc(get(p))}" placeholder="${esc(ph)}"></label>`;
const area=(p,l,ph='')=>`<label class="f"><span>${l}</span><textarea data-bind="${p}" placeholder="${esc(ph)}">${esc(get(p))}</textarea></label>`;
const checks=(base,arr)=>arr.map((c,i)=>`<label class="chk"><input type="checkbox" data-check="${base}.${i}.done" ${c.done?'checked':''}><span>${esc(c.label)}</span></label>`).join('');
const antrittLine=t=>t?`<div class="antritt"><b>Bei Antritt:</b> ${t}</div>`:'';

/* ---- start screen ---- */
function rStart(){
  const cont=!!S.inProgress&&!!S.type;
  return `<div class="hero"><h1>Abnahmeprotokoll erstellen</h1><p>Kostenlos, ohne Konto. Alle Daten und Fotos bleiben auf diesem Gerät.</p></div>
  ${cont?`<div class="card"><h2>Angefangenes Protokoll</h2><p class="summary">${esc(S.meta.objekt||'Ohne Adresse')} · ${TYPE_LABEL()} · ${S.photoCounter} Fotos</p><div class="stack" style="margin-top:10px"><button class="btn primary block" id="continue">Weiterarbeiten</button><button class="btn ghost block danger" id="discard">Verwerfen und neu beginnen</button></div></div>`:''}
  <div class="card"><h2>Neues Protokoll</h2>
    <div class="lbl" style="margin-bottom:6px">Art der Abnahme</div>
    <div class="choice"><button data-type="antritt" class="${S.type==='antritt'?'on':''}"><b>Antritt</b><small>Einzug – Zustand bei Übernahme festhalten</small></button><button data-type="rueckgabe" class="${S.type==='rueckgabe'?'on':''}"><b>Rückgabe</b><small>Auszug – Zustand bei Rückgabe, Mängel, Depot</small></button></div>
    <div class="lbl" style="margin:12px 0 6px">Objekt</div>
    <div class="choice"><button data-oart="wohnung" class="${S.objektArt==='wohnung'?'on':''}"><b>Wohnung</b></button><button data-oart="haus" class="${S.objektArt==='haus'?'on':''}"><b>Haus</b></button></div>
    <div class="lbl" style="margin:14px 0 4px">Räume</div>
    <div class="row two"><div><div class="lbl">Zimmer</div><div class="stepper"><button data-stp="zimmer|-1">−</button><output>${S.setup.zimmer}</output><button data-stp="zimmer|1">+</button></div></div>
    <div><div class="lbl">Bäder / WC</div><div class="stepper"><button data-stp="baeder|-1">−</button><output>${S.setup.baeder}</output><button data-stp="baeder|1">+</button></div></div></div>
    <div class="toggles">${[['flur','Flur / Korridor'],['balkon','Balkon / Sitzplatz'],...NEBEN].map(([k,n])=>`<label><input type="checkbox" data-setup="${k}" ${S.setup[k]?'checked':''}>${n}</label>`).join('')}</div>
    <p class="hint" style="margin-top:8px">Räume können später umbenannt, ergänzt oder gelöscht werden.</p>
    <button class="btn primary block" id="begin" ${S.type?'':'disabled'} style="margin-top:6px">Protokoll starten</button>
  </div>
  <div class="card"><h2>Antrittsprotokoll übernehmen</h2><p class="hint">Sie haben den Antritt mit ${APP_NAME} dokumentiert? Laden Sie die gesicherte Protokoll-Datei: Objekt, Räume, Zähler, Schlüssel und der Zustand bei Antritt werden für die Rückgabe übernommen.</p><button class="btn block" id="import">Protokoll-Datei laden (.json)</button></div>
  <div class="card"><h2>Beispiel ansehen</h2><p class="hint">Ein ausgefülltes Rückgabeprotokoll mit Musterdaten – zum Ausprobieren.</p><button class="btn block" id="demo">Beispiel laden</button></div>
  <p class="legal"><a href="${SITE}/impressum">Impressum</a> · <a href="${SITE}/datenschutz">Datenschutz</a> · <a href="${SITE}/verwaltungen">Für Verwaltungen</a></p>`;
}

function rMeta(){
  return `<div class="card"><h2>Objekt</h2>
  ${field('meta.objekt','Adresse','text','Strasse Nr., PLZ Ort')}
  ${field('meta.lage','Lage / Beschreibung','text','z. B. 3. OG links, 3.5-Zimmer-Wohnung')}
  </div><div class="card"><h2>Parteien</h2>
  ${field('meta.mieter','Mieter/in (Name)')}
  ${area('meta.vermieter','Vermieter/in bzw. Verwaltung','Name, Adresse')}
  ${field('meta.datum','Datum und Uhrzeit der Abnahme','datetime-local')}
  ${field('meta.zeugen','Weitere Anwesende / Zeugen')}
  </div>${isR()?`<div class="note">Hinweis: Mängel, für die der Mieter haften soll, müssen bei der Rückgabe sofort geprüft und gerügt werden (Art. 267a OR). Erfassen Sie sie hier im Protokoll.</div>`:`<div class="note">Hinweis: Versteckte Mängel, die erst nach dem Einzug auffallen, sollte der Mieter dem Vermieter innert ca. 10 Tagen schriftlich melden.</div>`}`;
}
function rZaehler(){
  const A=S.antritt;
  return `<div class="card"><p class="hint">Zählernummer und Stand notieren, Zähler fotografieren.</p>`+
  S.zaehler.map((z,i)=>`<div class="line"><div class="t">${esc(z.name)}</div>
    ${A&&A.zaehler[z.name]?antrittLine('Stand '+esc(A.zaehler[z.name].stand||'–')+(A.zaehler[z.name].nr?', Nr. '+esc(A.zaehler[z.name].nr):'')):''}
    <div class="row z"><div><div class="lbl">Zähler-Nr.</div><input type="text" data-bind="zaehler.${i}.nr" value="${esc(z.nr)}"></div>
    ${isR()?`<div><div class="lbl">Stand bei Antritt</div><input type="text" inputmode="decimal" data-bind="zaehler.${i}.ein" value="${esc(z.ein)}"></div><div><div class="lbl">Stand bei Rückgabe</div><input type="text" inputmode="decimal" data-bind="zaehler.${i}.aus" value="${esc(z.aus)}"></div>`
    :`<div style="grid-column:span 2"><div class="lbl">Stand bei Antritt</div><input type="text" inputmode="decimal" data-bind="zaehler.${i}.aus" value="${esc(z.aus)}"></div>`}</div>
    ${photosHtml('zaehler.'+i+'.photos')}</div>`).join('')+`</div>`;
}
function rSchluessel(){
  const A=S.antritt;
  return `<div class="card"><p class="hint">${isR()?'Anzahl mit dem Antrittsprotokoll abgleichen. Fehlende Schlüssel: Ersatz bzw. Zylinderwechsel zulasten des Mieters vermerken.':'Anzahl und Art aller übergebenen Schlüssel festhalten.'}</p>`+
  S.schluessel.map((k,i)=>`<div class="line"><div class="t">${esc(k.name)}</div>
    ${A&&A.schluessel[k.name]?antrittLine(esc(A.schluessel[k.name])+' Stück übergeben'):''}
    <div class="row k2">${isR()?`<div><div class="lbl">Bei Antritt</div><input type="text" inputmode="numeric" data-bind="schluessel.${i}.ein" value="${esc(k.ein)}"></div><div><div class="lbl">Zurückgegeben</div><input type="text" inputmode="numeric" data-bind="schluessel.${i}.aus" value="${esc(k.aus)}"></div>`
    :`<div style="grid-column:span 2"><div class="lbl">Übergeben (Anzahl)</div><input type="text" inputmode="numeric" data-bind="schluessel.${i}.aus" value="${esc(k.aus)}"></div>`}
    <div><div class="lbl">Bemerkung</div><input type="text" data-bind="schluessel.${i}.bem" value="${esc(k.bem)}"></div></div></div>`).join('')+`</div>`;
}
function itemHtml(b,it,antrittText){
  return `<div class="line"><div class="t"><span>${esc(it.label)}</span></div>
    ${antrittLine(antrittText)}
    <div class="seg"><button data-status="${b}|ok" class="${it.status==='ok'?'on-ok':''}">In Ordnung</button><button data-status="${b}|mangel" class="${it.status==='mangel'?'on-mangel':''}">Mangel</button><button data-status="${b}|na" class="${it.status==='na'?'on-na':''}">n. v.</button></div>
    ${it.status==='mangel'?`<label class="f"><span>Beschreibung</span><textarea data-bind="${b}.comment" placeholder="Was, wo, wie gross?">${esc(it.comment)}</textarea></label>
    ${isR()?`<div class="lbl" style="margin-top:8px">Einstufung</div><div class="seg small"><button data-art="${b}|normal" class="${it.art==='normal'?'on-ok':''}">Normale Abnützung</button><button data-art="${b}|uebermaessig" class="${it.art==='uebermaessig'?'on-mangel':''}">Übermässige Abnützung / Schaden</button></div>`:''}
    ${photosHtml(b+'.photos')}`:(it.comment?`<label class="f"><span>Bemerkung</span><textarea data-bind="${b}.comment">${esc(it.comment)}</textarea></label>`:'')}
    </div>`;
}
function rRaeume(){
  const A=S.antritt;
  return `<p class="hint" style="margin-top:12px">Jeden Punkt bewerten. Bei «Mangel» Beschreibung und Foto ergänzen. «n. v.» = nicht vorhanden.</p>`+
  S.raeume.map((r,ri)=>`<div class="card"><div class="roomhead"><input type="text" data-bind="raeume.${ri}.name" value="${esc(r.name)}" aria-label="Raumname"><button class="btn sm danger" data-delroom="${ri}">Löschen</button></div><p class="hint">${KIND_LABEL[r.kind]}</p>`+
    r.items.map((it,ii)=>{const b=`raeume.${ri}.items.${ii}`;const at=A&&A.raeume[r.name]&&A.raeume[r.name][it.label];return itemHtml(b,it,at?(at.status==='mangel'?'<span class="tag m">Mangel</span> '+esc(at.comment):at.status==='ok'?'in Ordnung':''):'');}).join('')+`</div>`).join('')+
  `<div class="card"><h2>Raum hinzufügen</h2><div class="addrow"><input type="text" id="newroom" placeholder="Name, z. B. Büro"><select id="newkind">${Object.entries(KIND_LABEL).filter(([k])=>k!=='neben').map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div><button class="btn block" id="addroom" style="margin-top:8px">Hinzufügen</button></div>`;
}
function rNeben(){
  return `<p class="hint" style="margin-top:12px">${isR()?'Nebenräume müssen vollständig geräumt und gereinigt sein.':'Zustand und Zuteilung der Nebenräume festhalten.'}</p>`+
  S.neben.map((n,i)=>`<div class="card"><div class="roomhead"><input type="text" data-bind="neben.${i}.name" value="${esc(n.name)}" aria-label="Name"><button class="btn sm danger" data-delneben="${i}">Löschen</button></div>
  ${checks('neben.'+i+'.checks',n.checks)}${area('neben.'+i+'.comment','Bemerkungen / Mängel','Abteil-Nr., Zustand …')}<div class="lbl" style="margin-top:10px">Fotos</div>${photosHtml('neben.'+i+'.photos')}</div>`).join('')+
  `<div class="card"><div class="addrow"><select id="newneben">${NEBEN.map(([k,n])=>`<option value="${k}">${n}</option>`).join('')}</select><button class="btn" id="addneben">Hinzufügen</button></div></div>`;
}
function rAllg(){
  return `<div class="card"><h2>${isR()?'Reinigung & Rückgabe':'Übernahme'}</h2>${checks('allg.checks',S.allg.checks)}${area('allg.comment','Bemerkungen')}<div class="lbl" style="margin-top:10px">Fotos</div>${photosHtml('allg.photos')}</div>`;
}
function autoMaengel(){
  const out=[];
  S.raeume.forEach(r=>r.items.forEach(it=>{if(it.status==='mangel')out.push({bereich:r.name+' – '+it.label.split(':')[0],text:it.comment,art:it.art,photos:it.photos,kosten:''});}));
  return out;
}
function rMaengel(){
  const auto=autoMaengel();
  return `${isR()?`<div class="note">Normale Abnützung geht zulasten des Vermieters. Bei übermässiger Abnützung oder Schäden haftet der Mieter anteilig nach Alter und Lebensdauer (paritätische Lebensdauertabelle). Kleiner Unterhalt (Kleinreparaturen) ist Sache des Mieters.</div>`:''}
  <div class="card"><h2>Aus den Räumen übernommen</h2>
  ${auto.length?auto.map(m=>`<div class="line"><div class="t"><span>${esc(m.bereich)}</span>${m.art?`<span class="tag ${m.art==='uebermaessig'?'m':'n'}">${m.art==='uebermaessig'?'übermässig':'normal'}</span>`:''}</div><p class="summary">${nl(m.text)||'<i>ohne Beschreibung</i>'} ${m.photos.length?'· Foto '+m.photos.map(p=>p.n).join(', '):''}</p></div>`).join(''):'<p class="hint">Keine Punkte als «Mangel» markiert.</p>'}
  </div>
  <div class="card"><h2>Weitere Mängel</h2><p class="hint">Alles, was oben nicht erfasst ist: Nebenräume, Gemeinschaftsflächen, Inventar.</p>`+
  S.maengel.map((m,i)=>{const b='maengel.'+i;return `<div class="line"><div class="t"><span>Mangel ${auto.length+i+1}</span><button class="btn sm danger" data-delmangel="${i}">Entfernen</button></div>
    ${field(b+'.bereich','Raum / Bereich')}${area(b+'.text','Beschreibung')}
    ${isR()?`<div class="lbl" style="margin-top:8px">Einstufung</div><div class="seg small"><button data-art="${b}|normal" class="${m.art==='normal'?'on-ok':''}">Normale Abnützung</button><button data-art="${b}|uebermaessig" class="${m.art==='uebermaessig'?'on-mangel':''}">Übermässig / Schaden</button></div>
    ${m.art==='uebermaessig'?field(b+'.kosten','Vereinbarte Kostenbeteiligung / Vorgehen','text','z. B. Rechnung folgt, Abzug vom Depot, gemäss Lebensdauertabelle'):''}`:''}
    ${photosHtml(b+'.photos')}</div>`;}).join('')+
  `<div style="margin-top:12px"><button class="btn" id="addmangel">+ Mangel hinzufügen</button></div></div>`;
}
function rFin(){
  return isR()?`<div class="card"><h2>Mietzinsdepot</h2>${field('fin.depotBank','Depot bei (Bank, Konto)')}${field('fin.depotBetrag','Betrag (CHF)','text')}${area('fin.depotFreigabe','Freigabe / Rückbehalt vereinbart','z. B. Freigabe nach Schlussabrechnung; Rückbehalt CHF … für Mangel Nr. …')}</div>
  <div class="card"><h2>Neue Adresse Mieter</h2>${area('fin.adresse','Neue Adresse / Kontakt')}${field('fin.iban','IBAN für Rückzahlungen (Depot, Nebenkosten)')}${field('fin.frist','Frist Nebenkostenabrechnung','text','z. B. innert 30 Tagen nach Abrechnungsperiode')}</div>
  <div class="card"><h2>Weitere Vereinbarungen</h2>${area('fin.vereinbarungen','Vereinbarungen','Nachmieter, Termine, Reparaturen bis …')}</div>`
  :`<div class="card"><h2>Mietzinsdepot</h2>${field('fin.depotBank','Depot hinterlegt bei (Bank, Konto)')}${field('fin.depotBetrag','Betrag (CHF)')}</div>
  <div class="card"><h2>Vereinbarungen</h2>${area('fin.vereinbarungen','Vereinbarungen','z. B. Vermieter behebt Mangel Nr. … bis …; Mieter darf … ')}</div>`;
}
function rAbschluss(){
  const a=S.abschluss;
  return `<div class="card"><h2>Abschluss</h2>${checks('abschluss.checks',a.checks)}
  ${field('abschluss.ort','Ort, Datum (für Unterschriften)','text','z. B. Zürich, 30.09.2026')}</div>
  <div class="card"><h2>Unterschrift Vermieter/in / Verwaltung</h2><canvas class="sig" data-sig="sigV"></canvas><div class="sigtools"><span>Mit dem Finger unterschreiben</span><button class="btn sm ghost" data-clearsig="sigV">Löschen</button></div></div>
  <div class="card"><h2>Unterschrift Mieter/in</h2><canvas class="sig" data-sig="sigM"></canvas><div class="sigtools"><span>Mit dem Finger unterschreiben</span><button class="btn sm ghost" data-clearsig="sigM">Löschen</button></div></div>
  <div class="card"><p class="hint">Die Unterschriften können auch auf dem gedruckten Protokoll erfolgen – die Felder dürfen leer bleiben.</p>
  <p class="summary">Fotos: <b>${S.photoCounter}</b> · Räume: <b>${S.raeume.length}</b> · Mängel: <b>${autoMaengel().length+S.maengel.length}</b></p></div>`;
}

/* ================= render ================= */
function render(toTop){
  const y=window.scrollY;
  document.body.classList.toggle('start',S.stage==='start');
  if(S.stage==='start'){$('#app').innerHTML=`<div class="topbar"><div class="brand"><b>${APP_NAME}</b><span>kostenlos · ohne Konto</span></div></div>${rStart()}`;window.scrollTo(0,0);return;}
  const ST=steps(), st=Math.min(S.step,ST.length-1), last=st===ST.length-1;
  S.step=st;
  $('#app').innerHTML=`<div class="topbar"><div class="brand"><b>${APP_NAME}</b><span class="type">${TYPE_LABEL()}</span></div><div class="stepline">${ST.map((s,i)=>`<i class="${i<st?'done':i===st?'cur':''}"></i>`).join('')}</div>
  <div class="stepname"><h1>${ST[st].n}</h1><small>Schritt ${st+1} von ${ST.length}</small></div></div>
  ${ST[st].r()}
  <div class="navbar"><div class="in"><button class="btn" id="prev">${st===0?'Start':'Zurück'}</button>${last?`<button class="btn primary" id="finish">Protokoll erstellen</button>`:`<button class="btn primary" id="next">Weiter</button>`}</div><div class="saved"></div></div>`;
  window.scrollTo(0,toTop?0:y);
  document.querySelectorAll('canvas.sig').forEach(initSig);
  save();
}
function go(n){if(n<0){S.stage='start';save();render(true);return;}S.step=Math.max(0,Math.min(steps().length-1,n));render(true);}

/* ================= events ================= */
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.bind)set(t.dataset.bind,t.value);});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.check){set(t.dataset.check,t.checked);}
  if(t.dataset.setup){S.setup[t.dataset.setup]=t.checked;save();}
});
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  // start
  if(b.dataset.type){S.type=b.dataset.type;save();render();return;}
  if(b.dataset.oart){S.objektArt=b.dataset.oart;save();render();return;}
  if(b.dataset.stp){const [k,d]=b.dataset.stp.split('|');S.setup[k]=Math.max(k==='baeder'?0:1,Math.min(10,S.setup[k]+ +d));save();render();return;}
  if(b.id==='begin'){startNew();return;}
  if(b.id==='continue'){S.stage='form';render(true);return;}
  if(b.id==='discard'){if(confirm('Angefangenes Protokoll inkl. Fotos löschen?')){const t=S.type,o=S.objektArt,su=S.setup;S=freshState();S.type=t;S.objektArt=o;S.setup=su;save();render(true);}return;}
  if(b.id==='import'){$('#importer').value='';$('#importer').click();return;}
  if(b.id==='demo'){loadDemo();return;}
  // form
  if(b.id==='prev')return go(S.step-1);
  if(b.id==='next')return go(S.step+1);
  if(b.id==='finish')return showProto();
  if(b.dataset.status){const [p,v]=b.dataset.status.split('|');set(p+'.status',v);render();return;}
  if(b.dataset.art){const [p,v]=b.dataset.art.split('|');set(p+'.art',v);render();return;}
  if(b.dataset.addphoto){pickPath=b.dataset.addphoto;$('#picker').value='';$('#picker').click();return;}
  if(b.dataset.delphoto){const [p,i]=b.dataset.delphoto.split('|');get(p).splice(+i,1);save();render();return;}
  if(b.dataset.delroom!=null){if(confirm('Raum «'+S.raeume[+b.dataset.delroom].name+'» löschen?')){S.raeume.splice(+b.dataset.delroom,1);save();render();}return;}
  if(b.id==='addroom'){const v=$('#newroom').value.trim();if(v){S.raeume.push(mkRoom(v,$('#newkind').value));save();render();}return;}
  if(b.dataset.delneben!=null){S.neben.splice(+b.dataset.delneben,1);save();render();return;}
  if(b.id==='addneben'){const k=$('#newneben').value;S.neben.push(mkNeben(k,NEBEN.find(x=>x[0]===k)[1]));save();render();return;}
  if(b.id==='addmangel'){S.maengel.push({bereich:'',text:'',art:'',photos:[],kosten:''});save();render();return;}
  if(b.dataset.delmangel!=null){S.maengel.splice(+b.dataset.delmangel,1);save();render();return;}

});

/* ================= photos ================= */
let pickPath=null;
$('#picker').addEventListener('change',async e=>{
  const files=[...e.target.files];if(!files.length||!pickPath)return;
  const arr=get(pickPath);
  for(const f of files){try{const src=await shrink(f);arr.push({n:++S.photoCounter,src});}catch(err){}}
  save();render();
});
function shrink(file){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file);const img=new Image();
  img.onload=()=>{const M=1400;let w=img.width,h=img.height;const k=Math.min(1,M/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
    const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.8));};
  img.onerror=()=>{URL.revokeObjectURL(url);rej();};img.src=url;});}

/* ================= signatures ================= */
function initSig(c){
  const key=c.dataset.sig;const ctx=c.getContext('2d');
  const r=c.getBoundingClientRect();c.width=r.width*2;c.height=r.height*2;ctx.scale(2,2);ctx.lineWidth=2;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';
  if(S.abschluss[key]){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=S.abschluss[key];}
  let d=false,last=null;
  const pos=ev=>{const rr=c.getBoundingClientRect();return {x:ev.clientX-rr.left,y:ev.clientY-rr.top};};
  c.addEventListener('pointerdown',ev=>{d=true;last=pos(ev);c.setPointerCapture(ev.pointerId);ev.preventDefault();});
  c.addEventListener('pointermove',ev=>{if(!d)return;const p=pos(ev);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p;ev.preventDefault();});
  const up=()=>{if(!d)return;d=false;S.abschluss[key]=c.toDataURL('image/png');save();};
  c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);
}

function importAntritt(d){

  catch(e){$('#fb-status').innerHTML='Senden nicht möglich. Bitte per E-Mail an <a href="mailto:feedback@abnahmeprotokoll.ch?subject=Feedback&body='+encodeURIComponent(msg+'\n\n'+ctx)+'">feedback@abnahmeprotokoll.ch</a>.';}
});

load().then(s=>{if(s&&s.meta){S=Object.assign(freshState(),s);}if(!(S.inProgress&&S.type))S.stage='start';if(location.hash==='#beispiel'&&!S.inProgress){history.replaceState(null,'',location.pathname);loadDemo();return;}render(true);});
})();
