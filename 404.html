<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seite nicht gefunden | Abnahmeprotokoll.ch</title>
<meta name="description" content="Diese Seite gibt es nicht.">
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#1F5F8B">
<style>
:root{--bg:#EEF1F3;--paper:#FFFFFF;--ink:#16212B;--muted:#5C6B78;--line:#CFD6DC;--accent:#1F5F8B;--accent-ink:#fff;--note:#FFF6DB;--note-ink:#6B4E00;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#141A1F;--paper:#1D252C;--ink:#EEF2F4;--muted:#9AA8B3;--line:#36434D;--accent:#6FAEE0;--accent-ink:#0E1B26;--note:#3A3117;--note-ink:#F1D98A}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
a{color:var(--accent)}h1,h2{margin:0;line-height:1.2;font-weight:600}p{margin:0}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}
header{border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;height:56px}
.logo{font-weight:600;text-decoration:none;color:var(--ink);letter-spacing:.01em}
.logo i{display:inline-block;width:10px;height:10px;background:var(--accent);border-radius:2px;margin-right:8px;vertical-align:1px}
main{padding:32px 0 40px}
h1{font-size:clamp(26px,6vw,34px);margin-bottom:6px}
h2{font-size:20px;margin:30px 0 8px}
.lead{color:var(--muted);margin-bottom:8px}
main p+p,main ul{margin-top:10px}
ul{padding-left:20px}li{margin-top:4px}
mark{background:var(--note);color:var(--note-ink);padding:0 4px;border-radius:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:13px 20px;border-radius:9px;border:1px solid var(--line);background:var(--paper);min-height:48px;text-decoration:none;color:inherit;font-weight:500;margin:14px 10px 0 0}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
footer{padding:24px 0 40px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
footer a{color:var(--muted);margin-right:14px}
</style>
</head>
<body>
<header><div class="wrap"><a class="logo" href="/"><i></i>Abnahmeprotokoll.ch</a></div></header>
<main><div class="wrap">
<h1>Seite nicht gefunden</h1>
<p class="lead">Diese Adresse gibt es nicht (mehr). Vielleicht hat sich ein Tippfehler eingeschlichen.</p>
<p><a class="btn primary" href="/app">Protokoll starten</a><a class="btn" href="/">Zur Startseite</a></p>

</div></main>
<footer><div class="wrap"><a href="/impressum">Impressum</a><a href="/datenschutz">Datenschutz</a><a href="/app">Protokoll starten</a></div></footer>
</body>
</html>
